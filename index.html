    <style>
      :root {
        --ink: #16374c;
        --deep: #073d59;
        --teal: #006c93;
        --mint: #e0f3fc;
        --lime: #bfeaff;
        --cream: #f1f7fc;
        --paper: #ffffff;
        --coral: #bc1169;
        --cyan: #05a5ea;
        --pink: #e32a8c;
        --line: rgba(22, 55, 76, 0.18);
        --shadow: 0 24px 70px rgba(7, 61, 89, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: auto;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
      }
      body.modal-open {
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      ::selection {
        background: var(--coral);
        color: #fff;
      }
      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      }
      .container {
        width: min(1180px, calc(100% - 48px));
        margin: auto;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 11px;
        font-weight: 800;
        color: var(--teal);
      }
      .eyebrow:before {
        content: "";
        width: 28px;
        height: 2px;
        background: var(--coral);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
      h2 {
        font-size: clamp(38px, 5vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.055em;
        margin: 18px 0 22px;
      }
      p {
        line-height: 1.7;
        color: #637371;
      }
      .muted {
        color: #73817f;
      }
      .section {
        padding: 110px 0;
      }
      .round-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        transition: 0.25s;
      }
      .round-btn:hover {
        background: var(--deep);
        color: #fff;
        transform: rotate(8deg);
      }

        border: 0;
        border-radius: 999px;
        padding: 14px 21px;

      body {
        overflow-x: clip;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      a,
      button,
      span,
      blockquote,
      dd {
        overflow-wrap: anywhere;
      }
      p,
      .muted {
        color: #4e6373;
      }
      button,
      input,
      textarea,
      select {
        min-width: 0;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
        transform: none;
      }
      :focus-visible {
        outline: 3px solid var(--pink);
        outline-offset: 4px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #617181;
        opacity: 1;
      }
      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      legend {
        font-weight: 800;
        padding: 0 8px;
      }
      .inline-icon {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }
      .inline-icon svg {
        max-width: none;
      }
      .btn {
        white-space: normal;
        line-height: 1.45;
        text-align: center;
      }
      .btn-primary {
        box-shadow: 0 12px 25px rgba(188, 17, 105, 0.18);
      }
      .btn-primary:hover {
        background: #9c0955;
      }
      .btn:disabled,
      .btn:disabled:hover {
        opacity: 1;
        color: #4e6373;
        background: #e9eef3;
        border: 1px solid #ccd8e2;
        box-shadow: none;
        transform: none;
      }
      input:disabled,
      textarea:disabled,
      select:disabled {
        opacity: 1;
        color: #526778;
        background: #f2f6f9;
        -webkit-text-fill-color: #526778;
      }
      .btn-soft {
        color: var(--deep);
        background: var(--mint);
        padding: 10px 16px;
      }
      .text-button {
        background: none;
        border: 0;
        color: var(--teal);
        padding: 16px 0;
        text-decoration: underline;
        font-weight: 700;
      }
      .brand-logo {
        display: inline-flex;
        width: 280px;
        max-width: 100%;
        padding: 5px 8px;
        border-radius: 10px;
        background: #fff;
        flex-shrink: 0;
      }
      .brand-logo > svg {
        width: 100%;
        height: auto;
        aspect-ratio: 1982 / 607;
        display: block;
        overflow: visible;
      }
      .brand-home {
        border: 0;
        background: transparent;
        padding: 0;
      }
      .navbar .brand-logo {
        background: transparent;
        border-radius: 0;
      }
      .nav-links a[aria-current="page"] {
        color: var(--lime);
      }
      .nav-links a[aria-current="page"]:after {
        width: 100%;
      }
      .mobile-navigation a {
        display: block;
        background: var(--cream);
        color: var(--deep);
        text-align: left;
        padding: 12px;
        border-radius: 8px;
      }
      .mobile-navigation a[aria-current="page"] {
        background: var(--mint);
        color: var(--teal);
        font-weight: 800;
      }
      .public-page {
        animation: public-page-enter 0.24s ease-out both;
      }
      .public-page:focus {
        outline: none;
      }
      .public-page-title {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;

          return { data: { ...unit, beds: resizedBeds(unit, beds, []) } };
        };
        if (kind.pooled) {
          const total = matching.reduce(
            (sum, unit) => sum + activeBeds(unit).length,
            0,

          if (count === total) return [];

                    units.filter((unit) => unit.kind === kind.value).length + 1,

                data: {

                  beds: resizedBeds(

                    activeBeds(matching[0]).length + count - total,
                    admissions,

          let remaining = total - count;
          const changes = [];
          for (const unit of matching.slice().reverse()) {
            const free = activeBeds(unit).filter(
              (bed) => !bedOccupant(admissions, unit.id, bed.id),

            const removed = Math.min(remaining, free);
            if (removed)
              changes.push({
                id: unit.id,
                data: {
                  ...unit,
                  beds: resizedBeds(
                    unit,
                    activeBeds(unit).length - removed,
                    admissions,
                  ),
                },
              });
            remaining -= removed;

          if (remaining)
            throw new Error(
              "The requested total is below current occupancy. Transfer or discharge patients first.",

            .slice(0, matching.length - count)
            .map((unit) => ({ id: unit.id, data: { ...unit, active: false } }));

                (entry) =>
                  String(entry.id) === String(unit.id) &&
                  entry.active !== false,
              );

                throw new Error(
                  "This unit was removed. Close this form and refresh.",

                      return;
                    localStorage.setItem(
                      "sreemantha-connection",
                      JSON.stringify(draft),
                    );
                    location.reload();
                  } catch (failure) {
                    setError(failure.message);
                  }
                }}
              >
                <div className="content-fields">
                  <InputField
                    label="Mode"
                    value={draft.mode}
                    options={[
                      { value: "demo", label: "Demo — fictional data only" },
                      { value: "payload", label: "Live backend" },
                    ]}
                    onChange={(mode) => setDraft({ ...draft, mode })}
                  />
                  {Object.keys(connectionDefaults)
                    .filter((key) => key !== "mode")
                    .map((key) => (
                      <InputField
                        key={key}
                        label={humanize(key)}
                        required
                        value={draft[key]}
                        onChange={(value) =>
                          setDraft({ ...draft, [key]: value })
                        }
                      />
                    ))}
                </div>
                {error && (
                  <p className="error-message" role="alert">
                    {error}
                  </p>
                )}
                <button className="btn btn-dark form-submit">
                  Save connection & reload
                </button>
              </form>
            </section>
            <section className="panel">
              <div className="panel-head">
                <h3>Backend handoff contract</h3>
              </div>
              <p>
                The matching schemas and access rules must be implemented in
                your backend. This single file supplies the website, custom
                admin UI and REST client only.
              </p>
              <button className="btn btn-soft" onClick={download}>
                Export content & contract
              </button>
              <pre className="contract-preview">
                {JSON.stringify(contract, null, 2)}
              </pre>
            </section>
          </div>
        );
      }
      function Login({ onBack, onLogin }) {
        const { content } = useApp();
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [show, setShow] = useState(false);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState("");
        const [configure, setConfigure] = useState(false);
        const lock = useRef(false);
        const submit = async (event) => {
          event.preventDefault();
          if (lock.current) return;
          lock.current = true;
          setBusy(true);
          setError("");
          try {
            const result = await API.request(`${connection.users}/login`, {
              method: "POST",
              body: { email, password },
            });
            if (!result.user)
              throw new Error(
                "The server did not return an authenticated user.",
              );
            setPassword("");
            await onLogin(result.user);
          } catch (failure) {
            setError(failure.message);
          } finally {
            lock.current = false;
            setBusy(false);
          }
        };
        return (
          <div className="login-screen">
            <section className="login-visual">
              <Image value={content.login.image} eager />
              <BrandLogo brand={content.brand} />
              <div className="login-quote">
                <div className="eyebrow">{content.login.eyebrow}</div>
                <h1>{content.login.title}</h1>
                <p>{content.login.text}</p>
              </div>
            </section>
            <section className="login-panel">
              <button
                className="round-btn back-site"
                onClick={onBack}
                aria-label="Back to website"
              >
                <Icon name="arrow-left" />
              </button>
              <div className="login-box">
                <div className="eyebrow">Admin Portal</div>
                <h2>Welcome back.</h2>
                <p>Manage website content and patient enquiries.</p>
                {live() ? (
                  <form onSubmit={submit}>
                    <InputField
                      label="Email address"
                      type="email"
                      value={email}
                      onChange={setEmail}
                      required
                      autoComplete="username"
                    />
                    <InputField
                      label="Password"
                      type={show ? "text" : "password"}
                      value={password}
                      onChange={setPassword}
                      required
                      autoComplete="current-password"
                    />
                    <label className="checkbox">
                      <input
                        type="checkbox"
                        checked={show}
                        onChange={(event) => setShow(event.target.checked)}
                      />
                      Show password
                    </label>
                    {error && (
                      <p role="alert" className="error-message">
                        {error}
                      </p>
                    )}
                    <button
                      className="btn btn-dark form-submit"
                      disabled={busy}
                    >
                      {busy ? "Authenticating…" : "Sign in to dashboard"}
                    </button>
                  </form>
                ) : (
                  <>
                    <div className="demo-note">
                      <strong>Frontend demo</strong>
                      <p>
                        No hospital system is connected. Use fictional patient
                        details only. Patient data disappears when this page
                        reloads.
                      </p>
                    </div>
                    <button
                      className="btn btn-dark form-submit"
                      onClick={() =>
                        onLogin({ name: "Demo administrator", demo: true })
                      }
                    >
                      Explore demo dashboard
                      <Icon name="arrow-right" />
                    </button>
                  </>
                )}
                <button
                  className="text-button"
                  onClick={() => setConfigure(!configure)}
                >
                  Configure backend connection
                </button>
                {configure && (
                  <Modal
                    title="Connection settings"
                    onClose={() => setConfigure(false)}
                    wide
                  >
                    <Integration />
                  </Modal>
                )}
              </div>
            </section>
          </div>
        );
      }
      function Dashboard({ onExit, onLogout }) {
        const { user, dirty, notify, refreshRecords, recordsBusy } = useApp();
        const [tab, setTab] = useState("overview");
        const [mobile, setMobile] = useState(false);
        const [admission, setAdmission] = useState(null);
        const { content } = useApp();
        const tabs = [
          ["overview", "layout-dashboard", "Overview"],
          ["content", "panels-top-left", "Content CMS"],
          ["enquiries", "inbox", "Enquiries"],
          ["admissions", "clipboard-heart", "Admissions"],
          ["capacity", "bed-double", "Rooms & beds"],
          ["doctors", "stethoscope", "Doctors"],
          ["reviews", "message-square-heart", "Reviews"],
          ["settings", "settings", "Hospital settings"],
          ["integration", "plug", "Integration"],
        ].filter(([key]) => user.role !== "staff" || ["overview", "enquiries", "admissions"].includes(key));
        const navigate = (next) => {
          if (!tabs.some(([key]) => key === next)) {
            notify("Administrator permission is required for this section.");
            return;
          }
          if (
            dirty &&
            next !== tab &&
            !window.confirm(
              "Leave this editor and discard unpublished changes?",
            )
          )
            return;
          setTab(next);
          setMobile(false);
        };
        return (
          <div className="dashboard">
            <aside className={`sidebar ${mobile ? "open" : ""}`}>
              <BrandLogo brand={content.brand} />
              <button
                className="round-btn mobile-sidebar-close"
                aria-label="Close dashboard navigation"
                onClick={() => setMobile(false)}
              >
                <Icon name="x" />
              </button>
              <nav className="sidebar-nav">
                {tabs.map(([key, icon, label]) => (
                  <button
                    className={`side-link ${tab === key ? "active" : ""}`}
                    aria-current={tab === key ? "page" : undefined}
                    key={key}
                    onClick={() => navigate(key)}
                  >
                    <Icon name={icon} />
                    <span>{label}</span>
                  </button>
                ))}
              </nav>
              <div className="side-spacer" />
              <button className="side-link" onClick={onExit}>
                <Icon name="external-link" />
                View website
              </button>
              <button className="side-link" onClick={onLogout}>
                <Icon name="log-out" />
                Sign out
              </button>
              <div className="user-mini">
                <div className="user-avatar">SA</div>
                <div>
                  <strong>
                    {user?.name || user?.email || "Administrator"}
                  </strong>
                  <span>
                    {live() ? "Authenticated session" : "Demo session"}
                  </span>
                </div>
              </div>
            </aside>
            <main className="dash-main">
              <header className="dash-header">
                <div className="dash-heading">
                  <button
                    className="round-btn mobile-dash-menu"
                    aria-label="Open dashboard navigation"
                    aria-expanded={mobile}
                    onClick={() => setMobile(!mobile)}
                  >
                    <Icon name="menu" />
                  </button>
                  <div className="dash-title">
                    <h1>
                      {tab === "overview"
                        ? "Your care, coordinated."
                        : tabs.find(([key]) => key === tab)?.[2]}
                    </h1>
                    <p>
                      {new Date().toLocaleDateString(undefined, {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric",
                      })}
                    </p>
                  </div>
                </div>
                <button
                  className="btn btn-primary"
                  onClick={() => setAdmission({})}
                >
                  <Icon name="plus" />
                  New admission
                </button>
              </header>
              <div className={`connection-banner ${live() ? "connected" : ""}`}>
                <span className="connection-dot" />
                <strong>{live() ? "Payload backend" : "Frontend demo"}</strong>
                <span>
                  {live()
                    ? "Changes are sent to your configured backend."
                    : "Fictional patient data only · session-only records"}
                </span>
              </div>
              {tab === "overview" && (
                <Overview navigate={navigate} openAdmission={setAdmission} />
              )}
              {["content", "doctors", "reviews", "settings"].includes(tab) && (
                <ContentEditor
                  key={tab}
                  initialGroup={
                    tab === "doctors"
                      ? "doctors"
                      : tab === "reviews"
                        ? "testimonials"
                        : tab === "settings"
                          ? "brand"
                          : "hero"
                  }
                />
              )}
              {["enquiries", "admissions"].includes(tab) && (
                <PatientRecords
                  key={tab}
                  type={tab}
                  openAdmission={setAdmission}
                />
              )}
              {tab === "capacity" && (
                <CareCapacity openAdmission={setAdmission} />
              )}
              {tab === "integration" && <Integration />}
            </main>
            {mobile && (
              <button
                className="sidebar-scrim"
                aria-label="Close navigation"
                onClick={() => setMobile(false)}
              />
            )}
            {admission && (
              <AdmissionForm
                {...admission}
                onClose={() => setAdmission(null)}
                onSaved={async (complete) => {
                  await refreshRecords();
                  if (complete) notify("Admission saved.");
                }}
              />
            )}
          </div>
        );
      }
      function App() {
        const [content, setContent] = useState(clone(defaultContent));
        const [view, setView] = useState(
          ["#admin", "#dashboard"].includes(location.hash) ? "login" : "site",
        );
        const [user, setUser] = useState(null);
        const [ready, setReady] = useState(false);
        const [loadError, setLoadError] = useState("");
        const [toast, setToast] = useState("");
        const [dirty, setDirty] = useState(false);
        const dirtyRef = useRef(false);
        dirtyRef.current = dirty;
        const [records, setRecords] = useState({
          enquiries: [],
          admissions: [],
          careUnits: [],
        });
        const [recordsBusy, setRecordsBusy] = useState(false);
        const [recordsError, setRecordsError] = useState("");
        const timer = useRef(null);
        const session = useRef(null);
        const refreshGeneration = useRef(0);
        const notify = (message) => {
          clearTimeout(timer.current);
          setToast(message);
          timer.current = setTimeout(() => setToast(""), 6000);
        };
        const refreshRecords = async () => {
          if (!session.current) return;
          const generation = ++refreshGeneration.current;
          setRecordsBusy(true);
          setRecordsError("");
          try {
            const collections = ["enquiries", "admissions", "careUnits"];
            const results = await Promise.allSettled(
              collections.map((collection) => API.list(collection)),
            );
            if (generation === refreshGeneration.current && session.current) {
              setRecords((current) => ({
                ...current,
                ...Object.fromEntries(
                  results.flatMap((result, index) =>
                    result.status === "fulfilled"
                      ? [[collections[index], result.value]]
                      : [],
                  ),
                ),
              }));
              setRecordsError(
                results
                  .flatMap((result, index) =>
                    result.status === "rejected"
                      ? [
                          `${humanize(collections[index])}: ${result.reason.message}`,
                        ]
                      : [],
                  )
                  .join(" "),
              );
            }
          } catch (failure) {
            if (generation === refreshGeneration.current)
              setRecordsError(failure.message);
          } finally {
            if (generation === refreshGeneration.current) setRecordsBusy(false);
          }
        };
        const clearSession = () => {
          session.current = null;
          refreshGeneration.current += 1;
          setUser(null);
          setDirty(false);
          setRecordsError("");
          setContent(clone(defaultContent));
          API.contentRevision = null;
          API.content().then((publicContent) => {
            if (!session.current) setContent(publicContent);
          }).catch(() => {});
          setRecords({ enquiries: [], admissions: [], careUnits: [] });
          setRecordsBusy(false);
        };
        const go = (next) => {
          if (
            dirty &&
            !window.confirm(
              "Leave this editor and discard unpublished changes?",
            )
          )
            return;
          const target =
            next === "dashboard" && !session.current ? "login" : next;
          setView(target);
          history.replaceState(
            null,
            "",
            target === "site"
              ? location.pathname + location.search
              : target === "login"
                ? "#admin"
                : "#dashboard",
          );
          window.scrollTo(0, 0);
        };
        const login = async (person) => {
          const staffContent = await API.content();
          setContent(staffContent);
          setLoadError("");
          session.current = person;
          setUser(person);
          go("dashboard");
          refreshRecords();
        };
        const logout = async () => {
          if (
            dirty &&
            !window.confirm("Sign out and discard unpublished changes?")
          )
            return;
          try {
            if (live())
              await API.request(`${connection.users}/logout`, {
                method: "POST",
              });
            clearSession();
            setView("login");
            history.replaceState(null, "", "#admin");
            notify("Signed out.");
          } catch (failure) {
            notify("Sign out failed: " + failure.message);
          }
        };
        const load = async () => {
          setLoadError("");
          try {
            setContent(await API.content());
          } catch (failure) {
            setLoadError(failure.message);
          } finally {
            const remaining = matchMedia("(prefers-reduced-motion: reduce)")
              .matches
              ? 0
              : Math.max(
                  0,
                  1400 -
                    (performance.now() -
                      (window.SREEMANTHA_LOADING_STARTED || 0)),
                );
            if (remaining)
              await new Promise((resolve) => setTimeout(resolve, remaining));
            setReady(true);
            const loader = document.getElementById("initial-loader");
            if (loader) {
              loader.classList.add("loader-complete");
              setTimeout(() => loader.remove(), 450);
            }
          }
        };
        useEffect(() => {
          API.onUnauthorized = () => {
            if (!session.current) return;
            clearSession();
            setView("login");
            notify("Your session expired. Please sign in again.");
          };
          load();
          if (live())
            API.request(`${connection.users}/me`)
              .then((result) => {
                if (result.user) {
                  session.current = result.user;
                  setUser(result.user);
                  if (["#dashboard", "#admin"].includes(location.hash))
                    setView("dashboard");
                  refreshRecords();
                }
              })
              .catch(() => {});
          const hashChange = (event) => {
            if (dirtyRef.current && !window.confirm("Leave this editor and discard unpublished changes?")) {
              history.replaceState(null, "", event.oldURL);
              return;
            }
            if (["#admin", "#dashboard"].includes(location.hash))
              setView(session.current ? "dashboard" : "login");
            else setView("site");
          };
          addEventListener("hashchange", hashChange);
          return () => {
            clearTimeout(timer.current);
            removeEventListener("hashchange", hashChange);
            API.onUnauthorized = null;
          };
        }, []);
        useEffect(() => {
          if (!ready) return;
          document.title =
            view === "site"
              ? publicPageTitle(content, readPublicPage())
              : content.brand.pageTitle;
          document
            .querySelector('meta[name="description"]')
            ?.setAttribute(
              "content",
              view === "site"
                ? resolvePublicPage(content, readPublicPage()).description
                : content.brand.description,
            );
          document
            .getElementById("loader-message")
            ?.replaceChildren(
              document.createTextNode(content.brand.loadingText),
            );
          if (!loadError) {
            try {
              localStorage.setItem(
                "sreemantha-brand-cache",
                JSON.stringify({ loadingText: content.brand.loadingText }),
              );
            } catch {}
          }
        }, [content.brand, ready, loadError, view]);
        useEffect(() => {
          const unload = (event) => {
            if (dirty) {
              event.preventDefault();
              event.returnValue = "";
            }
          };
          addEventListener("beforeunload", unload);
          return () => removeEventListener("beforeunload", unload);
        }, [dirty]);
        useEffect(() => {
          if (!user || !live()) return;
          const interval = setInterval(
            () =>
              API.request(`${connection.users}/refresh-token`, {
                method: "POST",
              }).catch((failure) => {
                if (failure.status !== 401)
                  notify(
                    "Session refresh failed. Please check your connection.",
                  );
              }),
            5 * 60 * 1000,
          );
          return () => clearInterval(interval);
        }, [user]);
        const publishContent = async (draft) => {
          const saved = await API.saveContent(draft);
          setContent(saved);
          return saved;
        };
        return (
          <AppContext.Provider
            value={{
              content,
              user,
              notify,
              publishContent,
              records,
              refreshRecords,
              recordsBusy,
              recordsError,
              dirty,
              setDirty,
            }}
          >
            {ready && (
              <>
                {loadError && (
                  <div className="load-error" role="alert">
                    <strong>Website content could not be loaded.</strong>
                    <span>
                      {loadError} {connection.locked
                        ? "The public website is unavailable until the connection recovers."
                        : "Default preview content is shown; no live write is simulated."}
                    </span>
                    <button className="btn btn-soft" onClick={load}>
                      Retry
                    </button>
                    <button
                      className="btn btn-soft"
                      onClick={() => go("login")}
                    >
                      Connection settings
                    </button>
                  </div>
                )}
                {view === "site" && !(connection.locked && loadError) && (
                  <PublicSite
                    onAdmin={() => go(session.current ? "dashboard" : "login")}
                  />
                )}
                {view === "login" && (
                  <Login onBack={() => go("site")} onLogin={login} />
                )}
                {view === "dashboard" && user && (
                  <Dashboard onExit={() => go("site")} onLogout={logout} />
                )}
              </>
            )}
            {toast && (
              <div className="toast" role="status">
                <span className="toast-dot" />
                {toast}
                <button
                  className="toast-close"
                  onClick={() => setToast("")}
                  aria-label="Dismiss notification"
                >
                  ×
                </button>
              </div>
            )}
            <div className="noise" aria-hidden="true" />
          </AppContext.Provider>
        );
      }
      class ApplicationBoundary extends React.Component {
        state = { failed: false };
        static getDerivedStateFromError() {
          return { failed: true };
        }
        componentDidCatch() {
          document.getElementById("initial-loader")?.remove();
        }
        render() {
          if (this.state.failed)
            return (
              <main className="panel" role="alert">
                <h1>The application could not be displayed.</h1>
                <p>Reload to recover. Unsaved changes may be lost; contact the administrator if this continues.</p>
                <button className="btn btn-dark" onClick={() => location.reload()}>Reload application</button>
              </main>
            );
          return this.props.children;
        }
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<ApplicationBoundary><App /></ApplicationBoundary>);
    </script>
  </body>
</html>
